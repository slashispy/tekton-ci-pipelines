# ServiceAccounts mínimos, uno por responsabilidad (RNF3). Ninguno tiene
# cluster-admin. Los permisos concretos (leer Applications de Argo CD, usar el
# token de GitHub, etc.) se añaden junto al Task que los necesita.
apiVersion: v1
kind: ServiceAccount
metadata: {name: pipeline-build, namespace: tekton-ci}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pipeline-pr, namespace: tekton-ci}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pipeline-smoke, namespace: tekton-ci}
